variables:
  - name: solution
    value: Seq.App.Teams.AdaptiveCard.slnx
  - name: build_configuration
    value: Release
  - name: nugetOutput
    value: $(Build.SourcesDirectory)/.build/nuget

trigger:
  - master
  - release
pr:
  branches:
    include:
    - '*'

stages:

- stage: ''
  displayName: ''
  jobs:
  - job: main_job
    pool:
      vmImage: 'ubuntu-latest'
    displayName: 'Seq.App.Teams.AdaptiveCard'

    steps:

    - task: UseDotNet@2
      inputs:
        useGlobalJson: true
      displayName: Install .NET SDK (from global.json)

#########
# BUILD #
#########

    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '-property:ContinuousIntegrationBuild=true --configuration $(build_configuration)'
      displayName: Build Solution

########
# TEST #
########

    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: '$(solution)'
        # publishTestResults:false stops the task injecting VSTest '--logger trx' args that
        # Microsoft.Testing.Platform doesn't understand; trx is produced via '--report-trx' instead
        publishTestResults: false
        arguments: '--configuration $(build_configuration) --no-build -- --report-trx --results-directory $(Build.SourcesDirectory)/.build/test-results'
      displayName: Run Tests
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      inputs:
        testRunner: VSTest
        testResultsFiles: '**/*.trx'
        testRunTitle: 'Tests'
        failTaskOnMissingResultsFile: true
      displayName: Publish test results
      condition: succeededOrFailed()

################
# CREATE NUGET #
################

    # non-release branches: produce a prerelease package (e.g. 2.3.0-rc.<buildId>)
    - task: DotNetCoreCLI@2
      inputs:
        command: 'pack'
        packagesToPack: '$(solution)'
        configuration: '$(build_configuration)'
        outputDir: '$(nugetOutput)'
        nobuild: true
        buildProperties: 'VersionSuffix=-rc.$(Build.BuildId)'
      displayName: Pack (prerelease)
      condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'release'))

    # release branch: produce a stable package (e.g. 2.3.0)
    - task: DotNetCoreCLI@2
      inputs:
        command: 'pack'
        packagesToPack: '$(solution)'
        configuration: '$(build_configuration)'
        outputDir: '$(nugetOutput)'
        nobuild: true
        buildProperties: 'ApplyVersionSuffix=false'
      displayName: Pack (release)
      condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'release'))

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(nugetOutput)'
        artifactName: 'nuget'
      displayName: Publish nuget to artifacts

#################
# PUBLISH NUGET #
#################

    - task: NuGetCommand@2
      inputs:
        command: 'push'
        packagesToPush: '$(nugetOutput)/Seq.App.Teams.AdaptiveCard.*.nupkg'
        nuGetFeedType: 'internal'
        publishVstsFeed: 'projects/projects'
      displayName: Publish to Azure Artifacts feed
      condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'release'))

    - task: NuGetCommand@2
      inputs:
        command: 'push'
        packagesToPush: '$(nugetOutput)/Seq.App.Teams.AdaptiveCard.*.nupkg'
        nuGetFeedType: 'external'
        publishFeedCredentials: 'nuget.org'
      displayName: Publish to Nuget.org
      condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'release'))
